[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ragnarok-local"
version = "0.1.0"
description = "Privacy-first local agent runtime"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2,<3", "anthropic>=0.50,<1", "pypdf>=6,<7", "python-multipart>=0.0.20,<1", "langgraph>=1.0.10,<2", "langgraph-checkpoint-sqlite>=3.0.3,<4", "PyMuPDF>=1.24,<2", "numpy>=1.24,<3", "openai>=1,<3", "sse-starlette>=2,<4"]

[project.optional-dependencies]
ocr = ["easyocr>=1.7,<2", "Pillow>=10,<13"]
test = ["pytest>=8,<10", "reportlab>=4,<5"]
blockchain = ["web3>=7.6,<8"]

[project.scripts]
ragnarok = "ragnarok.cli:main"

[tool.setuptools.packages.find]
include = ["ragnarok*", "thor_agent*"]

[tool.setuptools.package-data]
ragnarok = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

