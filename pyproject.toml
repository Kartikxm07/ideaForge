[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ragnarok-local"
version = "0.1.0"
description = "Privacy-first local agent runtime"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
ragnarok = "ragnarok.cli:main"

[tool.setuptools.packages.find]
include = ["ragnarok*"]

[tool.setuptools.package-data]
ragnarok = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

